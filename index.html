    function mapProductFromDB(row) {
      const metaInfo = extractMetaFromDescription(row.description || '');
      const displayName = String(row.name || row.title || 'Authentic 1-of-1 Sneaker');
      const displayEuSize = String(row.size ?? row.eu_size ?? '43');
      const displayInsoleInches = String(row.insole_inches ?? metaInfo.insoleInches ?? EU_TO_INSOLE_MAP[displayEuSize] ?? '10.8');

      const origPrice = Number(row.original_price ?? row.price ?? row.sale_price ?? 0);
      const salePrice = Number(row.sale_price ?? row.price ?? origPrice);
      const computedDisc = origPrice > 0 && salePrice < origPrice
        ? Math.round(((origPrice - salePrice) / origPrice) * 100)
        : Number(row.discount_percent ?? metaInfo.discountPercent ?? 0);

      const isSold = row.is_sold === true || row.sold === true || row.in_stock === false;
      const isOnOffer = Boolean(row.is_on_offer || computedDisc > 0);
      const isPrepaidOnly = Boolean(row.prepaid_only || row.is_prepaid_only || metaInfo.prepaidOnly);
      const isFreeDelivery = Boolean(row.free_delivery || metaInfo.freeDelivery);

      const gallery = Array.isArray(row.images) && row.images.length > 0
        ? row.images.filter(Boolean).map(String)
        : ['https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&w=900&q=80'];

      const parsedCondNum = parseFloat(String(row.condition || '9.0')) || 9;

      return {
        id: String(row.id || generateUUID()),
        customPairId: String(metaInfo.customPairId || row.id || '1'),
        imageRatio: String(metaInfo.imageRatio || '1:1'),
        imageFit: String(metaInfo.imageFit || 'cover'),
        imageZoom: Number(metaInfo.imageZoom || 1),
        defectImages: Array.isArray(metaInfo.defectImages) ? metaInfo.defectImages : [],
        name: displayName,
        title: displayName,
        brand: String(row.brand || 'PRESETS'),
        category: String(row.category || metaInfo.category || 'Casual'),
        sizeEU: displayEuSize,
        insoleInches: displayInsoleInches,
        price: origPrice > 0 ? origPrice : salePrice,
        salePrice: salePrice,
        discountPercent: computedDisc,
        isOnOffer: isOnOffer,
        prepaidOnly: isPrepaidOnly,
        freeDelivery: isFreeDelivery,
        status: isSold ? 'sold' : 'available',
        conditionText: String(row.condition || `${parsedCondNum.toFixed(1)}/10`),
        condition: {
          soles: Number(metaInfo.soles || Math.round(parsedCondNum) || 9),
          body: Number(metaInfo.body || Math.round(parsedCondNum) || 9),
          laces: Number(metaInfo.laces || Math.round(parsedCondNum) || 9),
          inside: Number(metaInfo.inside || Math.round(parsedCondNum) || 9)
        },
        description: String(metaInfo.cleanDesc || '100% Authentic 1-of-1 pre-loved pair. High quality guaranteed by PRESETS.'),
        images: gallery,
        createdAt: row.created_at ? new Date(row.created_at).getTime() : Date.now()
      };
    }

    function mapProductToDB(pair) {
      const cleanTitle = String(pair.name || pair.title || 'Authentic Pair').trim();
      const euStr = String(pair.sizeEU || pair.size || '43');
      const origPrice = Number(pair.price ?? pair.original_price) || 0;
      const discPct = Math.min(90, Math.max(0, Math.round(Number(pair.discountPercent) || 0)));
      const salePrice = Math.round(origPrice * (1 - discPct / 100));
      const isSold = pair.status === 'sold' || pair.is_sold === true;
      const isOnOffer = Boolean(pair.isOnOffer || discPct > 0);
      const avgCond = getAverageCondition(pair.condition);

      const firstImage = Array.isArray(pair.images) && pair.images.length > 0
        ? String(pair.images[0])
        : 'https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&w=900&q=80';

      const packedDesc = packMetaIntoDescription(
        pair.description || '100% Authentic 1-of-1 pre-loved pair. High quality guaranteed by PRESETS.',
        pair.customPairId || '',
        pair.imageRatio || '1:1',
        pair.imageFit || 'cover',
        pair.imageZoom || 1,
        pair.defectImages || [],
        {
          category: pair.category || 'Casual',
          insoleInches: pair.insoleInches || '10.8',
          discountPercent: discPct,
          prepaidOnly: Boolean(pair.prepaidOnly),
          freeDelivery: Boolean(pair.freeDelivery),
          soles: pair.condition?.soles ?? 9,
          body: pair.condition?.body ?? 9,
          laces: pair.condition?.laces ?? 9,
          inside: pair.condition?.inside ?? 9
        }
      );

      return {
        id: String(pair.id || pair.customPairId || generateUUID()),
        name: cleanTitle,
        brand: String(pair.brand || 'PRESETS'),
        size: euStr,
        condition: `${avgCond}/10`,
        original_price: origPrice,
        sale_price: salePrice,
        is_on_offer: isOnOffer,
        is_sold: isSold,
        images: Array.isArray(pair.images) && pair.images.length > 0 ? pair.images.slice(0, 5).map(String) : [firstImage],
        description: packedDesc
      };
    }

    function mapOrderFromDB(row, idx = 0) {
      const statusStr = String(row.order_status || row.status || 'Pending');
      const paymentMethodStr = String(row.payment_method || 'PREPAID').toUpperCase();
      const subtotalAmt = Number(row.subtotal ?? row.total_amount ?? row.total_pkr ?? 0);
      const advancePaidAmt = Number(row.advance_paid ?? 0);
      const codCollectableAmt = Number(row.cod_collectable_amount ?? 0);

      const isPrepaidPaid = statusStr.toUpperCase().startsWith('PAID') && !statusStr.toUpperCase().startsWith('UNPAID');
      const isCodAdvPaid = statusStr.toUpperCase().includes('ADV PAID') || advancePaidAmt > 0;
      const isOrderConfirmed = statusStr.toUpperCase().includes('CONFIRMED');

      const itemsArr = Array.isArray(row.items) ? row.items : [];
      const firstItemCode = itemsArr[0]?.pairCode || itemsArr[0]?.orderNumber || '';
      const fallbackNum = String(idx + 1);
      const orderIdStr = String(row.order_id || row.id || firstItemCode || fallbackNum);

      const hasFreeDeliveryPair = itemsArr.some((i) => Boolean(i.freeDelivery));
      const inferredShipping = subtotalAmt >= FREE_DELIVERY_THRESHOLD || hasFreeDeliveryPair ? 0 : SHIPPING_FEE;

      return {
        id: orderIdStr,
        orderNumber: String(firstItemCode || orderIdStr),
        customer: {
          fullName: String(row.customer_name || ''),
          phone: String(row.customer_phone || row.phone || ''),
          email: String(row.email || ''),
          city: String(row.customer_city || row.city || ''),
          address: String(row.customer_address || row.address || '')
        },
        paymentMethod: paymentMethodStr.includes('RETURN')
          ? 'RETURN_CLAIM'
          : paymentMethodStr.includes('CANCEL')
          ? 'CANCEL_REQUEST'
          : paymentMethodStr.includes('COD')
          ? 'COD'
          : 'PREPAID',
        prepaidPaidStatus: isPrepaidPaid ? 'PAID' : 'UNPAID',
        codAdvPaidStatus: isCodAdvPaid ? 'ADV PAID' : 'ADV UNPAID',
        orderConfirmed: isOrderConfirmed,
        items: itemsArr,
        totals: {
          finalTotalWithShipping: subtotalAmt,
          discountedProductSubtotal: Math.max(0, subtotalAmt - inferredShipping),
          shipping: inferredShipping,
          payableNow: advancePaidAmt,
          payableOnDelivery: codCollectableAmt
        },
        status: statusStr,
        createdAt: row.created_at ? new Date(row.created_at).toLocaleString() : new Date().toLocaleString()
      };
    }

    function mapOrderToDB(order) {
      const orderId = String(order.orderNumber || order.id || generateUUID());
      const totalAmt = Number(order.totals?.finalTotalWithShipping ?? order.subtotal ?? 0);
      const isPrepaid = order.paymentMethod === 'PREPAID';
      const advPaid = isPrepaid
        ? order.prepaidPaidStatus === 'PAID'
          ? totalAmt
          : 0
        : order.codAdvPaidStatus === 'ADV PAID'
        ? Number(order.totals?.payableNow || 500)
        : 0;
      const codCollectable = isPrepaid
        ? 0
        : Number(order.totals?.payableOnDelivery ?? Math.max(0, totalAmt - advPaid));

      return {
        order_id: orderId,
        customer_name: String(order.customer?.fullName || ''),
        customer_phone: String(order.customer?.phone || ''),
        customer_city: String(order.customer?.city || ''),
        customer_address: String(order.customer?.address || ''),
        items: Array.isArray(order.items) ? order.items : [],
        payment_method: String(order.paymentMethod || 'PREPAID'),
        subtotal: totalAmt,
        advance_paid: advPaid,
        cod_collectable_amount: codCollectable,
        order_status: String(order.status || 'Pending')
      };
    }

    function getPairCodeMap() {
      const map = {};
      const chronological = [...state.sneakers].sort(
        (a, b) => (a.createdAt || 0) - (b.createdAt || 0)
      );
      chronological.forEach((s, idx) => {
        const rawCustom = String(s.customPairId || '').trim();
        const normalizedCustom = /^\d+$/.test(rawCustom)
          ? String(parseInt(rawCustom, 10))
          : rawCustom;
        map[s.id] = normalizedCustom || String(idx + 1);
      });
      return map;
    }

    function getPairCode(pairOrId) {
      if (!pairOrId) return '1';
      if (typeof pairOrId === 'object') {
        if (pairOrId.customPairId && String(pairOrId.customPairId).trim()) {
          const raw = String(pairOrId.customPairId).trim();
          return /^\d+$/.test(raw) ? String(parseInt(raw, 10)) : raw;
        }
        if (pairOrId.pairCode && String(pairOrId.pairCode).trim()) {
          const raw = String(pairOrId.pairCode).trim();
          return /^\d+$/.test(raw) ? String(parseInt(raw, 10)) : raw;
        }
      }
      const id = typeof pairOrId === 'object' ? pairOrId.id : pairOrId;
      const map = getPairCodeMap();
      return map[id] || '1';
    }

    function getOrderDisplayNumber(order, fallbackIdx = 0) {
      if (!order) return '1';
      const fromItem =
        order.items?.[0]?.pairCode || order.items?.[0]?.orderNumber;
      if (fromItem) {
        const raw = String(fromItem).trim();
        return /^\d+$/.test(raw) ? String(parseInt(raw, 10)) : raw;
      }
      if (order.orderNumber) {
        const raw = String(order.orderNumber).trim();
        return /^\d+$/.test(raw) ? String(parseInt(raw, 10)) : raw;
      }
      const uuidRegex = /^[0-9a-f]{8}-/i;
      if (order.id && !uuidRegex.test(String(order.id))) {
        const raw = String(order.id).trim();
        return /^\d+$/.test(raw) ? String(parseInt(raw, 10)) : raw;
      }
      return String(fallbackIdx + 1);
    }

    function getEffectiveCodPolicyDescription() {
      const isCodAdvancePolicyActive = Boolean(state.storeConfig.codPolicyEnabled);
      const activeCodDepositAmount = isCodAdvancePolicyActive
        ? Number(state.storeConfig.codAdvanceAmount) || 500
        : 0;
      return isCodAdvancePolicyActive
        ? state.storeConfig.codPolicyText ||
            `For Cash on Delivery (COD) orders, a Rs. ${activeCodDepositAmount} advance booking deposit is required in our official JS Bank account (Ali Ammar - 03328559003 | IBAN: ${BANK_IBAN}) to lock your 1-of-1 sneaker. The Rs. ${activeCodDepositAmount} deposit is deducted from your total bill, and you pay the remaining balance upon delivery.`
        : 'Cash on Delivery (COD) is active with Rs. 0 Advance Required! You will pay 100% of your total bill in cash upon doorstep delivery. No returns or exchanges except for serious undisclosed damage or receiving the wrong pair.';
    }

    function getOrderTotals() {
      const cartItems = state.cart
        .map((id) => state.sneakers.find((s) => s.id === id))
        .filter((s) => Boolean(s) && s.status === 'available');

      const cartRequiresPrepaidOnly = cartItems.some((item) =>
        Boolean(item.prepaidOnly || item.is_prepaid_only)
      );
      if (cartRequiresPrepaidOnly && state.paymentMethod === 'COD') {
        state.paymentMethod = 'PREPAID';
      }

      const rawOriginalSubtotal = cartItems.reduce(
        (acc, item) => acc + (Number(item.price ?? item.price_pkr) || 0),
        0
      );
      const discountedProductSubtotal = cartItems.reduce(
        (acc, item) => acc + getEffectivePairPrice(item),
        0
      );
      const pairLevelSavings = rawOriginalSubtotal - discountedProductSubtotal;

      const hasFreeDeliveryPair = cartItems.some((item) =>
        Boolean(item.freeDelivery)
      );
      const qualifiesForFreeDelivery =
        discountedProductSubtotal >= FREE_DELIVERY_THRESHOLD ||
        hasFreeDeliveryPair;
      const shipping =
        cartItems.length > 0
          ? qualifiesForFreeDelivery
            ? 0
            : SHIPPING_FEE
          : 0;

      const isPrepaid = state.paymentMethod === 'PREPAID';
      const prepaidFivePercentDiscount = isPrepaid
        ? Math.round(discountedProductSubtotal * 0.05)
        : 0;

      const netSneakerTotal =
        discountedProductSubtotal - prepaidFivePercentDiscount;
      const finalTotalWithShipping = netSneakerTotal + shipping;

      const isCodAdvancePolicyActive = Boolean(
        state.storeConfig.codPolicyEnabled
      );
      const activeCodDepositAmount = isCodAdvancePolicyActive
        ? Number(state.storeConfig.codAdvanceAmount) || 500
        : 0;

      const codAdvanceRequired =
        cartItems.length > 0 && isCodAdvancePolicyActive
          ? activeCodDepositAmount
          : 0;

      const payableNow = isPrepaid ? finalTotalWithShipping : codAdvanceRequired;
      const payableOnDelivery = isPrepaid
        ? 0
        : Math.max(0, finalTotalWithShipping - codAdvanceRequired);

      return {
        cartItems,
        cartRequiresPrepaidOnly,
        isCodAdvancePolicyActive,
        activeCodDepositAmount,
        rawOriginalSubtotal,
        discountedProductSubtotal,
        pairLevelSavings,
        prepaidThreePercentDiscount: prepaidFivePercentDiscount,
        shipping,
        hasFreeDeliveryPair,
        qualifiesForFreeDelivery,
        finalTotalWithShipping,
        payableNow,
        payableOnDelivery
      };
    }

    async function syncSettingsToSupabase(nextConfig, toastMessage = '') {

    function isUserTypingInInput() {
      const el = document.activeElement;
      if (!el) return false;
      const tag = (el.tagName || '').toUpperCase();
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    }

    async function syncFromSupabase(silent = false) {
      try {
        const [settingsRes, productsRes, ordersRes, slipsRes, reviewsRes] = await Promise.allSettled([
          supabaseRest.fetchSettings(),
          supabaseRest.fetchProducts(),
          supabaseRest.fetchOrders(),
          supabaseRest.fetchDeliverySlips(),
          supabaseRest.fetchReviews()
        ]);

        let anyConnected = false;

        if (settingsRes.status === 'fulfilled') {
          anyConnected = true;
          if (settingsRes.value) {
            state.storeConfig = mapSettingsFromDB(settingsRes.value, state.storeConfig);
          } else {
            supabaseRest.upsertSettings(state.storeConfig).catch(() => {});
          }
        }

        // Authoritative overwrite: if an item is deleted in Supabase, it is immediately removed locally
        if (productsRes.status === 'fulfilled') {
          anyConnected = true;
          state.sneakers = productsRes.value;
          const validIds = new Set(state.sneakers.map((s) => String(s.id)));
          state.cart = state.cart.filter((id) => validIds.has(String(id)));
          if (state.activeView === 'product' && state.selectedPairId && !validIds.has(String(state.selectedPairId))) {
            state.selectedPairId = null;
            state.activeView = 'home';
          }
        }

        if (ordersRes.status === 'fulfilled') {
          anyConnected = true;
          state.orders = ordersRes.value;
        }

        if (slipsRes.status === 'fulfilled') {
          anyConnected = true;
          state.deliverySlips = slipsRes.value;
        }

        if (reviewsRes.status === 'fulfilled') {
          anyConnected = true;
          state.reviews = reviewsRes.value;
          if (
            state.reviewLightboxModal &&
            !state.reviews.some((r) => String(r.id) === String(state.reviewLightboxModal.id))
          ) {
            state.reviewLightboxModal = null;
          }
        }

        if (!anyConnected) {
          throw new Error('Could not reach Supabase tables');
        }

        state.supabaseSyncStatus = 'Cloud Database Connected';
        persistAllLocal();
        if (!silent || !isUserTypingInInput()) {
          renderApp();
        }
        if (!silent) {
          showToast('Synced all Supabase tables (Settings, Inventory, Orders, Slips & Reviews)!');
        }
      } catch (err) {
        state.supabaseSyncStatus = 'Local Fallback Mode';
        if (!silent) {
          renderApp();
          showToast('Using local data fallback (Run SQL schema in Supabase).');
        }
      }
    }

    function initSupabaseRealtimeSubscription() {
      if (!supabaseRealtimeClient) return;
      try {
        const channel = supabaseRealtimeClient
          .channel('presets-realtime-sync')
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'presets_inventory' },
            (payload) => {
              if (payload.eventType === 'DELETE' && payload.old && payload.old.id !== undefined) {
                const deletedId = String(payload.old.id);
                state.sneakers = state.sneakers.filter((s) => String(s.id) !== deletedId);
                state.cart = state.cart.filter((id) => String(id) !== deletedId);
                if (String(state.selectedPairId) === deletedId) {
                  state.selectedPairId = null;
                  if (state.activeView === 'product') state.activeView = 'home';
                }
                persistAllLocal();
                renderApp();
                showToast('Pair deleted from database in real-time.');
              } else {
                syncFromSupabase(true);
              }
            }
          )
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'reviews' },
            (payload) => {
              if (payload.eventType === 'DELETE' && payload.old && payload.old.id !== undefined) {
                const deletedId = String(payload.old.id);
                state.reviews = state.reviews.filter((r) => String(r.id) !== deletedId);
                if (state.reviewLightboxModal && String(state.reviewLightboxModal.id) === deletedId) {
                  state.reviewLightboxModal = null;
                }
                persistAllLocal();
                renderApp();
                showToast('Review deleted from database in real-time.');
              } else {
                syncFromSupabase(true);
              }
            }
          )
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'presets_orders' },
            (payload) => {
              if (payload.eventType === 'DELETE' && payload.old && payload.old.order_id !== undefined) {
                const deletedOrderId = String(payload.old.order_id);
                state.orders = state.orders.filter(
                  (o) => String(o.orderNumber) !== deletedOrderId && String(o.id) !== deletedOrderId
                );
                persistAllLocal();
                renderApp();
              } else {
                syncFromSupabase(true);
              }
            }
          )
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'presets_delivery_slips' },
            (payload) => {
              if (payload.eventType === 'DELETE' && payload.old && payload.old.slip_id !== undefined) {
                const deletedSlipId = String(payload.old.slip_id);
                state.deliverySlips = state.deliverySlips.filter((s) => String(s.slipId) !== deletedSlipId);
                persistAllLocal();
                renderApp();
              } else {
                syncFromSupabase(true);
              }
            }
          )
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'presets_settings' },
            () => {
              syncFromSupabase(true);
            }
          )
          .subscribe();
      } catch (e) {}

      // Instant background sync when user switches back to tab or focuses window
      window.addEventListener('focus', () => syncFromSupabase(true));
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          syncFromSupabase(true);
        }
      });

      // Lightweight periodic background sync every 8 seconds so deletions never lag
      setInterval(() => {
        if (document.visibilityState === 'visible' && !isUserTypingInInput()) {
          syncFromSupabase(true);
        }
      }, 8000);
    }

    function handleReviewPhotoUpload(inputEl) {
      const file = inputEl.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 700;
          let w = img.width;
          let h = img.height;
          if (w > h && w > maxDim) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else if (h > maxDim) {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          state.reviewForm.imageUrl = canvas.toDataURL('image/jpeg', 0.72);
          showToast('Review photo attached!');
          renderApp();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function buildAndSavePrepaidOrder() {
      const totals = getOrderTotals();
      const cartItems = totals.cartItems;
      const dbUuid = generateUUID();
      const orderNum = cartItems.length > 0
        ? cartItems.map((item) => getPairCode(item)).join('-')
        : String(state.orders.length + 1);

      const safeCustomer = {
        fullName: sanitizeUntrustedInput(state.customerForm.fullName).trim(),
        phone: sanitizeUntrustedInput(state.customerForm.phone).trim(),
        email: sanitizeUntrustedInput(state.customerForm.email).trim(),
        city: sanitizeUntrustedInput(state.customerForm.city).trim(),
        address: sanitizeUntrustedInput(state.customerForm.address).trim()
      };

      const pairsList = cartItems
        .map(
          (item, idx) =>
            `${idx + 1}. [Pair #${getPairCode(item)}] ${item.name || item.title} (EU ${item.sizeEU || item.eu_size || item.size} | Insole ${item.insoleInches}") — ${formatPKR(getEffectivePairPrice(item))}${item.freeDelivery ? ' [FREE DELIVERY PAIR]' : ''}`
        )
        .join('\n');

      const newOrder = {
        id: dbUuid,
        orderNumber: orderNum,
        customer: safeCustomer,
        items: cartItems.map((i) => ({
          id: i.id,
          pairCode: getPairCode(i),
          orderNumber: orderNum,
          name: i.name || i.title,
          sizeEU: i.sizeEU || i.eu_size || i.size,
          insoleInches: i.insoleInches,
          freeDelivery: Boolean(i.freeDelivery),
          price: getEffectivePairPrice(i)
        })),
        paymentMethod: 'PREPAID',
        prepaidPaidStatus: 'UNPAID',
        codPolicyWasEnabled: totals.isCodAdvancePolicyActive,
        totals: {
          ...totals,
          payableNow: totals.finalTotalWithShipping,
          payableOnDelivery: 0
        },
        status: `Order #${orderNum} • UNPAID — Pending Full Payment`,
        createdAt: new Date().toLocaleString()
      };

      const orderedIds = cartItems.map((i) => i.id);
      state.sneakers = state.sneakers.map((s) => {
        if (orderedIds.includes(s.id)) {
          const updated = { ...s, status: 'sold', sold: true, in_stock: false };
          supabaseRest.upsertProduct(updated).catch(() => {});
          return updated;
        }
        return s;
      });

      state.orders = [newOrder, ...state.orders];
      supabaseRest.upsertOrder(newOrder).catch(() => {});
      state.cart = [];
      persistAllLocal();

      return { newOrder, orderNum, pairsList, totals };
    }

    function handlePlaceCODOrder() {
      const totals = getOrderTotals();
      const cartItems = totals.cartItems;
      if (cartItems.length === 0) {
        showToast('Your bag is empty.');
        return;
      }
      if (totals.cartRequiresPrepaidOnly) {
        showToast('This pair is strictly Prepaid Only. COD is not available.');
        return;
      }
      if (!state.customerForm.fullName.trim() || !state.customerForm.phone.trim() || !state.customerForm.city.trim() || !state.customerForm.address.trim()) {
        showToast('Please complete your Name, Phone, City, and Address.');

      }
      if (isSuspiciousPayload(state.customerForm.fullName) || isSuspiciousPayload(state.customerForm.address)) {
        showToast('🛡️ Security Alert: Invalid characters blocked.');
        return;
      }

      const dbUuid = generateUUID();
      const orderNum = cartItems.length > 0 ? cartItems.map((i) => getPairCode(i)).join('-') : String(state.orders.length + 1);
      const safeCustomer = {
        fullName: sanitizeUntrustedInput(state.customerForm.fullName).trim(),
        phone: sanitizeUntrustedInput(state.customerForm.phone).trim(),
        email: sanitizeUntrustedInput(state.customerForm.email).trim(),
        city: sanitizeUntrustedInput(state.customerForm.city).trim(),
        address: sanitizeUntrustedInput(state.customerForm.address).trim()
      };

      const newOrder = {
        id: dbUuid,
        orderNumber: orderNum,
        customer: safeCustomer,
        items: cartItems.map((i) => ({
          id: i.id,
          pairCode: getPairCode(i),
          orderNumber: orderNum,
          name: i.name || i.title,
          sizeEU: i.sizeEU || i.eu_size || i.size,
          insoleInches: i.insoleInches,
          freeDelivery: Boolean(i.freeDelivery),
          price: getEffectivePairPrice(i)
        })),
        paymentMethod: 'COD',
        codAdvPaidStatus: 'ADV UNPAID',
        codPolicyWasEnabled: totals.isCodAdvancePolicyActive,
        totals: { ...totals },
        status: totals.isCodAdvancePolicyActive
          ? `Order #${orderNum} • ADV UNPAID — Awaiting Rs. ${totals.activeCodDepositAmount}`
          : `Order #${orderNum} • COD Order Placed (No Advance Required)`,
        createdAt: new Date().toLocaleString()
      };

      const orderedIds = cartItems.map((i) => i.id);
      state.sneakers = state.sneakers.map((s) => {
        if (orderedIds.includes(s.id)) {
          const updated = { ...s, status: 'sold', sold: true, in_stock: false };
          supabaseRest.upsertProduct(updated).catch(() => {});
          return updated;
        }
        return s;
      });

      state.orders = [newOrder, ...state.orders];
      supabaseRest.upsertOrder(newOrder).catch(() => {});
      state.cart = [];
      state.codSuccessModal = newOrder;
      persistAllLocal();
      renderApp();
    }

    async function sendBossMode2FAEmail() {
      state.isSendingEmail = true;
      state.otpStatusMessage = 'Sending 6-digit 2FA security code...';
      state.otpStatusType = 'info';
      renderApp();

      const code = Math.floor(100000 + Math.random() * 900000).toString();
      state.generatedOtp = code;

      const templateParams = {
        to_email: ADMIN_EMAIL,
        email: ADMIN_EMAIL,
        user_email: ADMIN_EMAIL,
        to_name: 'Admin',
        from_name: 'PRESETS Security',
        passcode: code,
        otp: code,
        code: code,
        verification_code: code,
        message: `Your PRESETS Boss Mode 2FA Verification Code is: ${code}`
      };

      try {
        if (window.emailjs && typeof window.emailjs.send === 'function') {
          await window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams, EMAILJS_PUBLIC_KEY);
        } else {
          const response = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              service_id: EMAILJS_SERVICE_ID,
              template_id: EMAILJS_TEMPLATE_ID,
              user_id: EMAILJS_PUBLIC_KEY,
              template_params: templateParams
            })
          });
          if (!response.ok) {
            const errText = await response.text();
            throw new Error(errText || '2FA service error');
          }
        }
        state.otpStatusType = 'success';
        state.otpStatusMessage = 'Verification code sent! Please check your email inbox.';
        state.otpStep = 'otp_verify';
        showToast('2FA Code Sent to your Email!');
      } catch (error) {
        state.otpStatusType = 'error';
        state.otpStatusMessage = `Failed to send email (${String(error?.text || error?.message || 'Check verification settings')}). Please try again.`;
        showToast('Failed to send 2FA email.');
      } finally {
        state.isSendingEmail = false;
        renderApp();
      }
    }

    async function handleBossPasswordSubmit(event) {
      event.preventDefault();
      if (Date.now() < state.lockoutUntil) {
        const waitSec = Math.ceil((state.lockoutUntil - Date.now()) / 1000);
        state.otpStatusType = 'error';
        state.otpStatusMessage = `🛡️ Security Lockout Active: Too many failed attempts. Try again in ${waitSec}s.`;
        showToast(`Locked out for ${waitSec}s.`);
        renderApp();
        return;
      }
      if (state.adminPasswordInput.trim() === ADMIN_PASSWORD) {
        state.failedLoginAttempts = 0;
        state.lockoutUntil = 0;
        persistAllLocal();
        await sendBossMode2FAEmail();
      } else {
        const nextFails = state.failedLoginAttempts + 1;
        state.failedLoginAttempts = nextFails;
        if (nextFails >= 4) {
          state.lockoutUntil = Date.now() + 60 * 1000;
          state.otpStatusType = 'error';
          state.otpStatusMessage = '🛡️ Brute-Force Protection Triggered: Locked for 60 seconds.';
          showToast('Security Lockout: 60s cooldown activated.');
        } else {
          state.otpStatusType = 'error';
          state.otpStatusMessage = `Invalid Owner Security Password (${4 - nextFails} attempt(s) remaining).`;
          showToast('Invalid Owner Security Password.');
        }
        persistAllLocal();
        renderApp();
      }
    }

    async function handleDevicePhotoUpload(inputEl) {
      const files = Array.from(inputEl.files || []);
      if (files.length === 0) return;
      const remainingSlots = 5 - state.pairForm.images.length;
      if (remainingSlots <= 0) {
        showToast('Maximum 5 photos allowed per pair.');
        inputEl.value = '';
        return;
      }
      const selectedFiles = files.slice(0, remainingSlots);
      state.aiVisionStatus = 'Checking photo...';
      renderApp();

      const readAndCompressImage = (file) =>
        new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const maxDim = 800;
              let w = img.width;
              let h = img.height;
              if (w > h && w > maxDim) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else if (h > maxDim) {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', 0.72));
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        });

      const processed = await Promise.all(selectedFiles.map(readAndCompressImage));
      state.pairForm.images = [...state.pairForm.images, ...processed].slice(0, 5);
      if (!state.pairForm.name.trim()) {
        state.pairForm.name = 'Air Force 1 Low Retro';
      }
      state.aiVisionStatus = `Uploaded ${processed.length} photo(s).`;
      showToast(`Uploaded ${processed.length} photo(s).`);
      inputEl.value = '';
      renderApp();
    }

    async function handleBannerPhotoUpload(inputEl) {
      const file = inputEl.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 1400;
          let w = img.width;
          let h = img.height;
          if (w > h && w > maxDim) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else if (h > maxDim) {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const compressedBanner = canvas.toDataURL('image/jpeg', 0.82);
          const updated = {
            ...state.storeConfig,
            saleBannerImage: compressedBanner,
            saleBannerEnabled: true
          };
          syncSettingsToSupabase(updated, 'Sale Banner photo uploaded & synced to Supabase!');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleSaveSneaker(event) {
      event.preventDefault();
      if (!state.pairForm.name.trim() || !state.pairForm.price) {

        return;
      }
      if (state.pairForm.images.length === 0) {

        return;
      }

      const defaultNextCode = String(state.sneakers.length + 1);
      const finalCustomPairId = String(state.pairForm.customPairId || '').trim() || defaultNextCode;
      const discPct = Math.min(90, Math.max(0, Number(state.pairForm.discountPercent) || 0));
      const origPrice = Number(state.pairForm.price) || 0;
      const salePrice = Math.round(origPrice * (1 - discPct / 100));

      const formattedPair = {
        id: state.editingPairId ? String(state.editingPairId) : finalCustomPairId,
        customPairId: finalCustomPairId,
        imageRatio: '1:1',
        imageFit: state.pairForm.imageFit || 'cover',

        images: state.pairForm.images.slice(0, 5),

      if (state.editingPairId) {
        state.sneakers = state.sneakers.map((s) => (s.id === state.editingPairId ? formattedPair : s));
        supabaseRest.upsertProduct(formattedPair).catch(() => {});

      state.bossTab = 'inventory';

    // ==========================================
    // 10. 3D PARTICLE CANVASES & SCROLL MOTION (PLAIN JS)
    // ==========================================
    let heroAnimId = null;
    function initHeroPortalCanvas() {
      if (heroAnimId) {
        cancelAnimationFrame(heroAnimId);
        heroAnimId = null;
      }
      const canvas = document.getElementById('hero-particle-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let time = 0;

      let width = (canvas.width = canvas.parentElement?.offsetWidth || window.innerWidth);
      let height = (canvas.height = canvas.parentElement?.offsetHeight || 460);

      const shardCount = 96;
      const shards = Array.from({ length: shardCount }, (_, i) => {
        const ringIdx = i % 3;
        const baseRadius = 115 + ringIdx * 72;
        return {
          angle: (Math.PI * 2 * i) / shardCount,
          ringIdx,
          baseRadius,
          zOffset: (Math.random() - 0.5) * 160,
          speed: (0.006 + ringIdx * 0.003) * (ringIdx % 2 === 0 ? 1 : -1),
          size: Math.random() * 4.5 + 2.5,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.06,
          isGold: i % 2 === 0
        };
      });

      const drawPolygon = (x, y, radius, sides, rotation, strokeStyle, fillStyle, lineWidth = 1.2) => {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.beginPath();
        for (let s = 0; s < sides; s++) {
          const a = (Math.PI * 2 * s) / sides;
          const px = Math.cos(a) * radius;
          const py = Math.sin(a) * radius;
          if (s === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        if (fillStyle) {
          ctx.fillStyle = fillStyle;
          ctx.fill();
        }
        if (strokeStyle) {
          ctx.strokeStyle = strokeStyle;
          ctx.lineWidth = lineWidth;
          ctx.stroke();
        }
        ctx.restore();
      };

      const renderHero = () => {
        if (!document.body.contains(canvas)) return;
        time += 0.016 + Math.abs(window.__presetsScrollVel || 0) * 0.0018;
        ctx.clearRect(0, 0, width, height);

        const scrollVel = window.__presetsScrollVel || 0;
        const scrollPos = window.scrollY || 0;
        const cx = width / 2;
        const cy = height / 2 + Math.sin(time * 0.9) * 6 - Math.min(55, scrollPos * 0.12) + scrollVel * 0.45;

        const coreRadius = Math.max(width, height) * 0.48;
        const coreGrad = ctx.createRadialGradient(cx, cy, 8, cx, cy, coreRadius);
        coreGrad.addColorStop(0, 'rgba(255, 95, 0, 0.30)');
        coreGrad.addColorStop(0.35, 'rgba(212, 175, 55, 0.14)');
        coreGrad.addColorStop(0.7, 'rgba(255, 60, 0, 0.05)');
        coreGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = coreGrad;
        ctx.fillRect(0, 0, width, height);

        for (let r = 0; r < 4; r++) {
          const ringRad = 85 + r * 58 + Math.sin(time * 1.6 + r) * 8 + Math.abs(scrollVel) * 1.4;
          const rotDir = r % 2 === 0 ? 1 : -1;
          const rotAngle = time * 0.35 * rotDir + (scrollPos * 0.004 + scrollVel * 0.02) * rotDir;
          const alpha = 0.26 - r * 0.04;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(1.35, 0.62 + Math.sin(time * 0.7 + r) * 0.08);
          drawPolygon(0, 0, ringRad, r % 2 === 0 ? 6 : 8, rotAngle, r % 2 === 0 ? `rgba(255, 95, 0, ${alpha})` : `rgba(212, 175, 55, ${alpha})`, null, 1.5);
          ctx.restore();
        }

        const tiltX = 0.45 + scrollVel * 0.015;
        const tiltY = time * 0.25 + scrollPos * 0.003;

        for (let i = 0; i < shards.length; i++) {
          const s = shards[i];
          s.angle += s.speed * (1 + Math.abs(scrollVel) * 0.14);
          s.rot += s.rotSpeed + scrollVel * 0.005;
          const rad = s.baseRadius * (1 + Math.abs(scrollVel) * 0.012);
          const rawX = Math.cos(s.angle) * rad * 1.35;
          const rawZ = Math.sin(s.angle) * rad;
          const rawY = Math.sin(s.angle * 2 + time * 1.5) * 36 + s.zOffset * 0.35 - scrollVel * 1.6;

          const cosX = Math.cos(tiltX);
          const sinX = Math.sin(tiltX);
          const y1 = rawY * cosX - rawZ * sinX;
          const z1 = rawY * sinX + rawZ * cosX;

          const cosY = Math.cos(tiltY * 0.25);
          const sinY = Math.sin(tiltY * 0.25);
          const x2 = rawX * cosY + z1 * sinY;
          const z2 = -rawX * sinY + z1 * cosY;

          const fov = 460;
          const scale = fov / Math.max(80, fov + z2 + 240);
          const px = cx + x2 * scale;
          const py = cy + y1 * scale;
          const sz = Math.max(1.6, s.size * scale * 1.3);

          drawPolygon(
            px,
            py,
            sz,
            i % 3 === 0 ? 3 : 4,
            s.rot,
            s.isGold ? 'rgba(255, 240, 200, 0.9)' : 'rgba(255, 165, 90, 0.9)',
            s.isGold ? 'rgba(212, 175, 55, 0.45)' : 'rgba(255, 85, 0, 0.50)',
            1.1
          );
        }

        heroAnimId = requestAnimationFrame(renderHero);
      };

      renderHero();
    }

    function initGlobalParticleCanvas() {
      const canvas = document.getElementById('global-particle-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let time = 0;
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const pointer = { x: width / 2, y: height / 2, active: false };
      const plasmaNodes = [];
      const shardBursts = [];
      const hexRipples = [];

      window.addEventListener(
        'mousemove',
        (e) => {
          pointer.x = e.clientX;
          pointer.y = e.clientY;
          pointer.active = true;
          const spot = document.getElementById('cursor-spotlight');
          if (spot) {
            spot.style.background = `radial-gradient(520px circle at ${e.clientX}px ${e.clientY}px, rgba(255, 95, 0, 0.11), rgba(212, 175, 55, 0.045) 42%, transparent 78%)`;
          }
          plasmaNodes.push({ x: e.clientX, y: e.clientY, rot: Math.random() * Math.PI, life: 1, size: 7 });
          if (plasmaNodes.length > 22) plasmaNodes.shift();
        },
        { passive: true }
      );

      window.addEventListener('click', (e) => {
        hexRipples.push({ x: e.clientX, y: e.clientY, r: 8, maxR: 150, life: 1 });
        for (let i = 0; i < 18; i++) {
          const angle = (Math.PI * 2 * i) / 18 + (Math.random() - 0.5) * 0.2;
          const speed = Math.random() * 5.2 + 1.6;
          shardBursts.push({
            x: e.clientX,
            y: e.clientY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            rot: Math.random() * Math.PI,
            rotSpeed: (Math.random() - 0.5) * 0.18,
            life: 1,
            size: Math.random() * 4.5 + 2,
            isGold: i % 2 === 0
          });
        }
      });

      const prisms = Array.from({ length: 58 }, (_, idx) => {
        const depth = 0.35 + Math.random() * 0.85;
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          depth,
          vx: (Math.random() - 0.5) * 0.35 * depth,
          vy: (-Math.random() * 0.45 - 0.12) * depth,
          size: (Math.random() * 4.2 + 2.2) * depth,
          sides: idx % 3 === 0 ? 6 : idx % 2 === 0 ? 4 : 3,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.03,
          palette: idx % 3 === 0 ? 'gold' : idx % 2 === 0 ? 'orange' : 'amber',
          phase: Math.random() * Math.PI * 2
        };
      });

      const drawShape = (cx, cy, r, sides, rot, stroke, fill) => {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rot);
        ctx.beginPath();
        for (let i = 0; i < sides; i++) {
          const a = (Math.PI * 2 * i) / sides;
          const sx = Math.cos(a) * r;
          const sy = Math.sin(a) * r;
          if (i === 0) ctx.moveTo(sx, sy);
          else ctx.lineTo(sx, sy);
        }
        ctx.closePath();
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 1.1;
          ctx.stroke();
        }
        ctx.restore();
      };

      const renderLoop = () => {
        time += 0.016;
        ctx.clearRect(0, 0, width, height);
        window.__presetsScrollVel = (window.__presetsScrollVel || 0) * 0.92;
        const scrollVel = window.__presetsScrollVel || 0;

        for (let i = plasmaNodes.length - 1; i >= 0; i--) {
          const n = plasmaNodes[i];
          n.life -= 0.05;
          n.rot += 0.08;
          if (n.life <= 0) {
            plasmaNodes.splice(i, 1);
            continue;
          }
          drawShape(n.x, n.y, n.size * n.life, 4, n.rot, `rgba(255, 130, 30, ${n.life * 0.7})`, `rgba(212, 175, 55, ${n.life * 0.25})`);
        }

        for (let i = 0; i < prisms.length; i++) {
          const p = prisms[i];
          p.phase += 0.02;
          p.rot += p.rotSpeed + scrollVel * 0.004;
          p.x += p.vx + Math.sin(time + p.phase) * 0.22;
          p.y += p.vy - scrollVel * p.depth * 0.85;

          if (p.x < -40) p.x = width + 40;
          if (p.x > width + 40) p.x = -40;
          if (p.y < -40) p.y = height + 40;
          if (p.y > height + 40) p.y = -40;

          const alpha = (0.35 + Math.sin(p.phase) * 0.18) * p.depth;
          const strokeCol = p.palette === 'gold' ? `rgba(255, 225, 150, ${alpha * 1.5})` : `rgba(255, 105, 20, ${alpha * 1.5})`;
          const fillCol = p.palette === 'gold' ? `rgba(212, 175, 55, ${alpha * 0.45})` : `rgba(255, 85, 0, ${alpha * 0.45})`;
          drawShape(p.x, p.y, p.size, p.sides, p.rot, strokeCol, fillCol);
        }

        for (let i = hexRipples.length - 1; i >= 0; i--) {
          const hr = hexRipples[i];
          hr.r += (hr.maxR - hr.r) * 0.12;
          hr.life -= 0.032;
          if (hr.life <= 0) {
            hexRipples.splice(i, 1);
            continue;
          }
          drawShape(hr.x, hr.y, hr.r, 6, time, `rgba(255, 110, 20, ${hr.life * 0.65})`, null);
        }

        for (let i = shardBursts.length - 1; i >= 0; i--) {
          const b = shardBursts[i];
          b.x += b.vx;
          b.y += b.vy;
          b.vx *= 0.94;
          b.vy *= 0.94;
          b.rot += b.rotSpeed;
          b.life -= 0.028;
          if (b.life <= 0) {
            shardBursts.splice(i, 1);
            continue;
          }
          drawShape(
            b.x,
            b.y,
            b.size * b.life,
            3,
            b.rot,
            b.isGold ? `rgba(255, 235, 180, ${b.life})` : `rgba(255, 120, 30, ${b.life})`,
            b.isGold ? `rgba(212, 175, 55, ${b.life * 0.6})` : `rgba(255, 85, 0, ${b.life * 0.6})`
          );
        }

        requestAnimationFrame(renderLoop);
      };

      renderLoop();
    }

    // Live Countdown & Scroll Listeners
    function startCountdownAndSecurityListeners() {
      setInterval(() => {
        if (!state.storeConfig.countdownEnabled || !state.storeConfig.countdownEndTime) return;
        const target = new Date(state.storeConfig.countdownEndTime).getTime();
        const diff = target - Date.now();
        if (isNaN(target) || diff <= 0) {
          state.countdownRemaining = { days: '00', hours: '00', minutes: '00', seconds: '00', expired: true };
        } else {
          const d = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
          const h = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
          const m = String(Math.floor((diff / 1000 / 60) % 60)).padStart(2, '0');
          const s = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');
          state.countdownRemaining = { days: d, hours: h, minutes: m, seconds: s, expired: false };
          const dEl = document.getElementById('cd-days');
          const hEl = document.getElementById('cd-hrs');
          const mEl = document.getElementById('cd-min');
          const sEl = document.getElementById('cd-sec');
          if (dEl) dEl.textContent = d;
          if (hEl) hEl.textContent = h;
          if (mEl) mEl.textContent = m;
          if (sEl) sEl.textContent = s;
        }
      }, 1000);

      let lastScrollY = window.scrollY || 0;
      window.addEventListener(
        'scroll',
        () => {
          const curY = window.scrollY || 0;
          const vel = Math.max(-32, Math.min(32, curY - lastScrollY));
          window.__presetsScrollVel = vel;
          lastScrollY = curY;

          const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
          const pct = Math.min(100, Math.max(0, (curY / maxScroll) * 100));
          const bar = document.getElementById('scroll-progress-bar');
          if (bar) bar.style.width = `${pct}%`;

          const quickControls = document.getElementById('quick-scroll-controls');
          if (quickControls) {
            if (curY > 260) {
              quickControls.classList.remove('hidden');
              quickControls.classList.add('flex');
            } else {
              quickControls.classList.add('hidden');
              quickControls.classList.remove('flex');
            }
          }

          const heroBox = document.getElementById('hero-3d-container');
          if (heroBox) {
            const tiltX = Math.max(-16, Math.min(16, vel * 0.48));
            const tiltY = Math.max(-10, Math.min(10, Math.sin(curY * 0.015) * 6));
            const scale = Math.max(0.88, 1 - Math.min(0.12, curY * 0.00028) + Math.abs(vel) * 0.0018);
            const ty = Math.min(64, curY * 0.18) - vel * 0.65;
            heroBox.style.transform = `perspective(1100px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) translateY(${ty}px) scale(${scale})`;
          }
        },
        { passive: true }
      );

      window.addEventListener('keydown', (e) => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
          (e.ctrlKey && e.key.toUpperCase() === 'U')
        ) {
          e.preventDefault();
          showToast('🛡️ PRESETS Security Shield: Source inspection is restricted.');
        }
      });

      window.addEventListener('contextmenu', (e) => {
        if (e.target?.tagName === 'IMG') {
          e.preventDefault();
          showToast('🛡️ PRESETS Vault: 1-of-1 Image Assets are Protected.');
        }
      });
    }

    // Initialize Application on Load
    window.addEventListener('DOMContentLoaded', () => {
      if (window.emailjs) {
        try {
          window.emailjs.init(EMAILJS_PUBLIC_KEY);
        } catch (e) {}
      }
      renderApp();
      initGlobalParticleCanvas();
      startCountdownAndSecurityListeners();
      syncFromSupabase(true);
      initSupabaseRealtimeSubscription();
    });
  </script>
